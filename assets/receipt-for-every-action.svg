<svg viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">A receipt for every action</title>
<desc id="desc">Your agent does an action. It makes a signed receipt for that one action. Each receipt holds the hash of the receipt before it, so the receipts make a chain. Anyone can verify the chain. If someone changes or deletes a receipt, the chain breaks and the check fails.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/>
  </marker>
  <marker id="arrowMuted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#7a8399"/>
  </marker>
</defs>
<rect x="0" y="0" width="1200" height="430" fill="#f5f5f5"/>
<text x="70" y="44" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" fill="#2d3142">A Receipt For Every Action</text>
<text x="70" y="64" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">SIGNED, LINKED, CHECKABLE</text>
<rect x="70" y="112" width="205" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="78" y="120" width="36" height="16" rx="4" fill="#ececec"/>
<text x="96.0" y="132" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">STEP</text>
<text x="172.5" y="150.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Agent Acts</text>
<text x="172.5" y="164.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">sends an email or</text>
<text x="172.5" y="176.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">deletes a file</text>
<rect x="355" y="112" width="205" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="363" y="120" width="36" height="16" rx="4" fill="#ececec"/>
<text x="381.0" y="132" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">STEP</text>
<text x="457.5" y="150.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Receipt</text>
<text x="457.5" y="164.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">a signed record</text>
<text x="457.5" y="176.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">of one action</text>
<line x1="275" y1="160.0" x2="351" y2="160.0" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="640" y="112" width="205" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="648" y="120" width="36" height="16" rx="4" fill="#ececec"/>
<text x="666.0" y="132" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">STEP</text>
<text x="742.5" y="150.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Chain</text>
<text x="742.5" y="164.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">each receipt holds the</text>
<text x="742.5" y="176.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">hash of the one before</text>
<line x1="560" y1="160.0" x2="636" y2="160.0" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="925" y="112" width="205" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="933" y="120" width="36" height="16" rx="4" fill="#ececec"/>
<text x="951.0" y="132" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">STEP</text>
<text x="1027.5" y="150.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Verify</text>
<text x="1027.5" y="164.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">anyone can check that</text>
<text x="1027.5" y="176.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">nothing changed</text>
<line x1="845" y1="160.0" x2="921" y2="160.0" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="742.5" y1="208" x2="742.5" y2="254" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
<rect x="640" y="258" width="490" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="885.0" y="286.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Change Or Delete One Receipt</text>
<text x="885.0" y="300.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">the chain breaks and the check fails</text>
<line x1="70" y1="352" x2="1130" y2="352" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="70" y="378" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">FLOW</text>
<line x1="150" y1="374" x2="180" y2="374" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<text x="190" y="378" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">next step</text>
<line x1="600" y1="374" x2="630" y2="374" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
<text x="640" y="378" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">what happens if someone changes the record</text>
</svg>
