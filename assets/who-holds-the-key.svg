<svg viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Who holds the signing key</title>
<desc id="desc">A receipt is only as strong as its signing key. If the key is in the agent process, the agent can forge receipts. A separate daemon that holds the key is stronger. A hardware security module or a cloud key service is stronger again. Anchor checkpoints send the chain head to a place the signer cannot change, to catch a removed tail.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/>
  </marker>
  <marker id="arrowMuted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#7a8399"/>
  </marker>
</defs>
<rect x="0" y="0" width="1200" height="430" fill="#f5f5f5"/>
<text x="70" y="44" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" fill="#2d3142">Who Holds The Signing Key?</text>
<text x="70" y="64" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">THE RECEIPT IS ONLY AS STRONG AS THE KEY</text>
<rect x="70" y="112" width="320" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="78" y="120" width="60" height="16" rx="4" fill="#ececec"/>
<text x="108.0" y="132" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">OPTION 1</text>
<text x="230.0" y="150.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">In The Agent</text>
<text x="230.0" y="164.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">simple, but the agent</text>
<text x="230.0" y="176.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">can forge receipts</text>
<rect x="440" y="112" width="320" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="448" y="120" width="60" height="16" rx="4" fill="#ececec"/>
<text x="478.0" y="132" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">OPTION 2</text>
<text x="600.0" y="150.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">In A Daemon</text>
<text x="600.0" y="164.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">a separate process holds</text>
<text x="600.0" y="176.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">the key and signs events</text>
<line x1="390" y1="160.0" x2="436" y2="160.0" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="810" y="112" width="320" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="818" y="120" width="60" height="16" rx="4" fill="#ececec"/>
<text x="848.0" y="132" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">OPTION 3</text>
<text x="970.0" y="150.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">In An HSM Or KMS</text>
<text x="970.0" y="164.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">a hardware or cloud key</text>
<text x="970.0" y="176.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">service holds the key</text>
<line x1="760" y1="160.0" x2="806" y2="160.0" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="600.0" y1="208" x2="600.0" y2="254" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
<rect x="70" y="258" width="1060" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="600.0" y="286.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Anchor Checkpoints</text>
<text x="600.0" y="300.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">send the chain head to a place the signer cannot change, to catch a removed tail</text>
<line x1="70" y1="352" x2="1130" y2="352" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="70" y="378" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">FLOW</text>
<line x1="150" y1="374" x2="180" y2="374" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<text x="190" y="378" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">more protection for the key</text>
<line x1="600" y1="374" x2="630" y2="374" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
<text x="640" y="378" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">an extra check for a removed tail</text>
</svg>
